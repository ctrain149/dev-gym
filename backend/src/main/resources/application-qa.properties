# ─────────────────────────────────────────────────────────────────────────────
# Profile: QA
# Activate with: -Dspring.profiles.active=qa  (or SPRING_PROFILES_ACTIVE=qa)
# Purpose: Persistent test DB, production-like security, reduced SQL noise
#          Simulates a shared test environment without production credentials
# ─────────────────────────────────────────────────────────────────────────────

# File-based H2 so test data survives restarts
# In a real project this would point to a shared PostgreSQL/MySQL instance
spring.datasource.url=jdbc:h2:file:./data/devfeed-qa;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update = apply schema changes, never drop existing data
spring.jpa.hibernate.ddl-auto=update

# H2 console disabled in shared environments
spring.h2.console.enabled=false

# Reduced noise — only warn-level Hibernate and Security logs
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT — secrets injected via environment variables
jwt.secret=${JWT_SECRET:devgym-qa-secret-change-this-in-real-qa}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Swagger — enabled in QA for tester access; disable if environment is public
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
