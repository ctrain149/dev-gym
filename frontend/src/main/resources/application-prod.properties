# ─────────────────────────────────────────────────────────────────────────────
# Profile: PROD
# Activate with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# Purpose: Production-grade settings — external DB, no console, minimal logging
#
# NEVER commit real credentials here.
# Inject secrets via environment variables, Vault, or a secrets manager.
# ─────────────────────────────────────────────────────────────────────────────

# Thymeleaf — caching on for performance
spring.thymeleaf.cache=true

# External relational database (PostgreSQL example)
# Values injected at deploy time via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devstore}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:devstore}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# validate = verify schema matches entities, but never alter it
# Migrations should be managed by Flyway or Liquibase in production
spring.jpa.hibernate.ddl-auto=validate

# H2 console must never be exposed in production
spring.h2.console.enabled=false

# Silent SQL — errors only
spring.jpa.show-sql=false
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.devgym=INFO

# Connection pool tuning (HikariCP defaults shown for reference)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
