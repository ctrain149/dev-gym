<h2 mat-dialog-title>{{ isEdit ? "Edit Product" : "Add New Product" }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="product-form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.hasError('required')"
        >Name is required</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" />
        <span matTextPrefix>$&nbsp;</span>
        <mat-error *ngIf="form.get('price')?.hasError('required')"
          >Price is required</mat-error
        >
        <mat-error *ngIf="form.get('price')?.hasError('min')"
          >Price must be 0 or greater</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" />
        <mat-error *ngIf="form.get('stock')?.hasError('min')"
          >Stock must be 0 or greater</mat-error
        >
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <input matInput formControlName="category" />
      <mat-error *ngIf="form.get('category')?.hasError('required')"
        >Category is required</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Image URL</mat-label>
      <input matInput formControlName="imageUrl" />
    </mat-form-field>

    <mat-checkbox formControlName="active">Active</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onSubmit()">
    {{ isEdit ? "Save" : "Create" }}
  </button>
</mat-dialog-actions>
