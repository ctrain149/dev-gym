spring.application.name=devstore-frontend
server.port=8081

# Active profile — override with -Dspring.profiles.active=qa|prod
spring.profiles.active=dev

# ─────────────────────────────────────────────────────────────────────────────
# Thymeleaf
# ─────────────────────────────────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# tmvc-01: Set to false in dev so templates reload without restart
spring.thymeleaf.cache=false

# ─────────────────────────────────────────────────────────────────────────────
# H2 in-memory database (tmvc-04)
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:devstore;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# tmvc-04 / tmvc-05: Uncomment to see SQL
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# ─────────────────────────────────────────────────────────────────────────────
# Security (tmvc-07) — default user for development
# ─────────────────────────────────────────────────────────────────────────────
# TODO (tmvc-07): Replace with a UserDetailsService backed by H2
spring.security.user.name=admin
spring.security.user.password=admin

# ─────────────────────────────────────────────────────────────────────────────
# Backend API base URL (used by WebClient in tmvc-13)
# ─────────────────────────────────────────────────────────────────────────────
# app.api.base-url=http://localhost:8080/api/v1
