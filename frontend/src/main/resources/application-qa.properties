# ─────────────────────────────────────────────────────────────────────────────
# Profile: QA
# Activate with: -Dspring.profiles.active=qa  (or SPRING_PROFILES_ACTIVE=qa)
# Purpose: Persistent test database, cache on, reduced logging
#          Simulates a shared test environment without production credentials
# ─────────────────────────────────────────────────────────────────────────────

# Thymeleaf — enable cache (QA should behave closer to prod)
spring.thymeleaf.cache=true

# File-based H2 so data persists between restarts in QA
# In a real project this would point to a shared PostgreSQL/MySQL instance
spring.datasource.url=jdbc:h2:file:./data/devstore-qa;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update = apply schema changes without dropping data
spring.jpa.hibernate.ddl-auto=update

# H2 console disabled in shared environments
spring.h2.console.enabled=false

# Reduced SQL noise — only warn-level Hibernate logs
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# QA credentials — would come from environment variables or a secrets manager
spring.security.user.name=${QA_ADMIN_USER:qa-admin}
spring.security.user.password=${QA_ADMIN_PASSWORD:changeme}
