# ─────────────────────────────────────────────────────────────────────────────
# Profile: PROD
# Activate with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# Purpose: Production-grade settings — external DB, no console, minimal logging
#
# NEVER commit real credentials here.
# Inject secrets via environment variables, Vault, or a secrets manager.
# ─────────────────────────────────────────────────────────────────────────────

# External relational database (PostgreSQL example)
# Values injected at deploy time via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devfeed}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:devfeed}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# validate = verify the schema matches entities but never alter it
# Use Flyway or Liquibase to manage migrations in production
spring.jpa.hibernate.ddl-auto=validate

# H2 console must never be exposed in production
spring.h2.console.enabled=false

# Silent — errors only from Spring/Hibernate, INFO from our own code
spring.jpa.show-sql=false
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.devgym=INFO

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT — must be injected; never hardcode a production secret
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# Swagger — disabled in production (exposes API surface)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
