# ─────────────────────────────────────────────────────────────────────────────
# Profile: DEV
# Activated automatically (spring.profiles.active=dev in application.properties)
# Purpose: Fast local development — in-memory DB, verbose SQL, relaxed security
# ─────────────────────────────────────────────────────────────────────────────

# H2 in-memory database — recreated fresh on every restart
spring.datasource.url=jdbc:h2:mem:devfeed-dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Verbose SQL — see exactly what JPA generates (great for spotting N+1 problems)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring Security — show auth decisions in the console
logging.level.org.springframework.security=DEBUG

# JWT (spr-08) — dev secret, short expiry for rapid testing
jwt.secret=devgym-dev-secret-key-must-be-at-least-256-bits-long-for-hmac
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Swagger / OpenAPI (spr-14)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
