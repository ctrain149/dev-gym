server:
  port: 9090

spring:
  application:
    name: reverse-proxy-example

  cloud:
    gateway:
      # ── APPROACH 1a: YAML-based route definitions ──
      # (These are equivalent to the Java routes in GatewayConfig.java.
      #  Comment out GatewayConfig @Configuration to use these instead.)
      #
      # routes:
      #   - id: backend-api
      #     uri: http://localhost:8080
      #     predicates:
      #       - Path=/api/**
      #     filters:
      #       - StripPrefix=1
      #       - AddRequestHeader=X-Proxy, dev-gym-gateway
      #       - name: Retry
      #         args:
      #           retries: 3
      #           statuses: INTERNAL_SERVER_ERROR
      #
      #   - id: auth-service
      #     uri: http://localhost:8081
      #     predicates:
      #       - Path=/auth/**
      #     filters:
      #       - StripPrefix=1
      #
      #   - id: legacy-rewrite
      #     uri: http://localhost:8080
      #     predicates:
      #       - Path=/legacy/**
      #     filters:
      #       - RewritePath=/legacy/(?<segment>.*), /api/v2/${segment}

      # Global default filters applied to all routes
      default-filters:
        - AddResponseHeader=X-Gateway, dev-gym-proxy
        - AddRequestHeader=X-Request-Start, ${#datetime}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.devgym.reverseproxy: DEBUG
