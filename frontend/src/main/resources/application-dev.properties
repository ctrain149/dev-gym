# ─────────────────────────────────────────────────────────────────────────────
# Profile: DEV
# Activated automatically (spring.profiles.active=dev in application.properties)
# Purpose: Fast local development — in-memory DB, template hot-reload, verbose SQL
# ─────────────────────────────────────────────────────────────────────────────

# Thymeleaf — disable cache so edits appear without restart
spring.thymeleaf.cache=false

# H2 in-memory database — wiped and recreated on every restart
spring.datasource.url=jdbc:h2:mem:devstore-dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Verbose SQL — helpful for seeing what JPA generates
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging — show Spring Security decisions and SQL params
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Default dev user (replaced by UserDetailsService in tmvc-09)
spring.security.user.name=admin
spring.security.user.password=admin
