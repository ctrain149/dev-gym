spring.application.name=devfeed-api
server.port=8080

# Active profile — override with -Dspring.profiles.active=qa|prod
spring.profiles.active=dev

# TODO: Your first task (spr-01) is to configure H2, security, and a health endpoint.
# See the coach dashboard for details.
spring.datasource.url=jdbc:h2:mem:devfeed;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always