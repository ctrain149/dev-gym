spring.application.name=devfeed-api
server.port=8080

# TODO: Your first task (spr-01) is to configure H2, security, and a health endpoint.
# See the coach dashboard for details.

# ─────────────────────────────────────────────────────────────────────────────
# Spring MVC Practice Track (mvc-01 through mvc-15)
# Uncomment each section as you reach the relevant task.
# ─────────────────────────────────────────────────────────────────────────────

# mvc-03: Jackson snake_case serialization
# spring.jackson.property-naming-strategy=SNAKE_CASE
# spring.jackson.default-property-inclusion=non_null
# spring.jackson.serialization.write-dates-as-timestamps=false

# mvc-04 / mvc-05: JPA SQL logging (enable to observe N+1 problem)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# mvc-08: JWT secrets (change before any real use!)
# jwt.secret=devgym-change-this-secret-key-must-be-at-least-256-bits-long
# jwt.access-token-expiration-ms=900000
# jwt.refresh-token-expiration-ms=604800000

# mvc-14: Swagger / OpenAPI
# springdoc.api-docs.path=/api-docs
# springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.swagger-ui.try-it-out-enabled=true
